name: Bug report
description: Something is parsed, corrected or checked wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real MRZs, passport photos or any personal data.** Reproduce the problem with
        a synthetic MRZ (`generateMrz` / `buildMrz` from `passport-mrz/generate`) or the ICAO specimens.
  - type: textarea
    id: input
    attributes:
      label: Synthetic input
      description: The synthetic MRZ text (or a description of the document type and layout).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Relevant part of the JSON output.
      render: json
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: passport-mrz 0.1.0, Node 22 / Chrome 130
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real passport or personal data.
          required: true
